<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#198754">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.svg" type="image/svg+xml">
<title>ROMA TIME</title>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f4f6f8}
body{display:flex;align-items:center;justify-content:center}
.container{width:min(420px,calc(100% - 40px));box-sizing:border-box;background:white;border-radius:15px;padding:30px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
h1{margin:0 0 12px}
p{color:#666;line-height:1.5}
#install{display:none;width:100%;border:0;border-radius:10px;padding:15px;margin-top:12px;background:#198754;color:white;font-size:16px;font-weight:bold}
#open{display:block;width:100%;box-sizing:border-box;border-radius:10px;padding:15px;margin-top:12px;background:#198754;color:white;text-decoration:none;font-weight:bold}
#status{font-size:13px;color:#777;margin-top:15px}
</style>
</head>
<body>
<div class="container">
  <h1>ROMA TIME</h1>
  <p id="message">Abriendo ROMA TIME...</p>
  <button id="install">INSTALAR APP</button>
  <a id="open" href="https://script.google.com/macros/s/AKfycbyuK0q4A6HJsUwgDhezgBmf_XPyk9I28665VlN4DaAbLOQ52Ca0W6twFq68rKk033R7w/exec">ABRIR ROMA TIME</a>
  <div id="status"></div>
</div>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbyuK0q4A6HJsUwgDhezgBmf_XPyk9I28665VlN4DaAbLOQ52Ca0W6twFq68rKk033R7w/exec";
let deferredPrompt=null;

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("./service-worker.js",{scope:"./"})
      .then(function(registration){console.log("ROMA TIME service worker activo:",registration.scope)})
      .catch(function(error){console.error("Error registrando service worker:",error)});
  });
}

window.addEventListener("beforeinstallprompt",function(event){
  event.preventDefault();
  deferredPrompt=event;
  document.getElementById("install").style.display="block";
  document.getElementById("message").textContent="ROMA TIME está lista para instalarse.";
});

document.getElementById("install").addEventListener("click",async function(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById("install").style.display="none";
});

window.addEventListener("appinstalled",function(){
  deferredPrompt=null;
  document.getElementById("install").style.display="none";
  document.getElementById("status").textContent="ROMA TIME instalada correctamente.";
});

/*
 * No usamos iframe para Google Apps Script.
 * La aplicación se abre directamente para que google.script.run
 * funcione dentro del HTML Service de Apps Script.
 */
setTimeout(function(){window.location.replace(APP_URL)},1200);
</script>
</body>
</html>
