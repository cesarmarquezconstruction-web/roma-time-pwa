<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#198754">
<link rel="manifest" href="manifest.webmanifest">
<title>ROMA TIME</title>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#f4f6f8;
}

body{
  display:flex;
  flex-direction:column;
}

header{
  height:54px;
  background:#198754;
  color:white;
  display:flex;
  align-items:center;
  padding:0 18px;
  font-size:20px;
  font-weight:bold;
}

header span{
  flex:1;
}

#install{
  display:none;
  border:0;
  border-radius:8px;
  padding:9px 14px;
  background:white;
  color:#198754;
  font-weight:bold;
}

iframe{
  flex:1;
  width:100%;
  border:0;
}
</style>
</head>

<body>

<header>
  <span>ROMA TIME</span>
  <button id="install">Instalar</button>
</header>

<iframe
  src="https://script.google.com/macros/s/AKfycbyuK0q4A6HJsUwgDhezgBmf_XPyk9I28665Vl9N4DaAbLOQ52Ca0W6twFq68rKk033R7w/exec"
  allow="geolocation">
</iframe>

<script>
let deferredPrompt;

window.addEventListener("beforeinstallprompt", function(e){
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("install").style.display = "block";
});

document.getElementById("install").addEventListener("click", async function(){
  if(!deferredPrompt) return;

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;
  document.getElementById("install").style.display = "none";
});
</script>

</body>
</html>
